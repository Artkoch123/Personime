{% extends "base.html" %}
{% block content %}
<div class="container text-center py-4">
    <h1 class="mb-5">{{ question }}</h1>
    <form method="POST">
        <textarea class="form-control mb-3" name="form" rows="3" required></textarea>
        <button type="submit" class="btn btn-dark">Далее</button>
        {% if num > 1 %}
            <a href="{{ url_for('form', num=num - 1) }}" class="btn btn-outline-dark">Назад</a>
        {% endif %}
    </form>
</div>
{% endblock %}
